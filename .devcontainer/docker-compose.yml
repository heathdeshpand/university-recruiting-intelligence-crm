# Codespaces / Dev Containers environment: the app container plus a database.
#
# This is development tooling, not a deployment. The database password is
# fixed and trivial on purpose -- the container is not reachable from outside
# the environment, and putting a "real" secret here would only teach the habit
# of committing secrets.

services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    # The canonical dev-container mount. devcontainer.json's workspaceFolder
    # points inside this, at /workspaces/<repo-name>.
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruiting_crm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
